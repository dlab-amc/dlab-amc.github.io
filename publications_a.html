<style>
  .skel-cell-important {
    position: relative;
  }
  .search-input-wrap {
    position: absolute;
    display: flex;
    align-items: center;
    top: 0;
    right: 0;
    transform: translateY(-50%);
    gap: 8px;
  }
  .search-input:focus {
    outline: none !important;
    border: none !important;
  }
  .search-input::placeholder {
    font-size: 15px;
    line-height: normal;
  }
  .search-button {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    padding: 0;
    width: 3rem;
    height: 3rem;
    background-color: #006065;
    color: #fff;
    font-size: 1rem;
  }
  .search-button:hover {
    background-color: rgb(0, 101, 101);
  }
</style>

<script>
  const CLASS_ORDER = ['ALL'];
  let selectedClass = 'ALL';
  let currentSearch = '';

  function normalizeSemicolonList(str) {
    return (str || '')
      .split(';')
      .map((s) => s.trim())
      .filter(Boolean)
      .join('; ');
  }

  function formatBilingual(kor, eng) {
    const k = normalizeSemicolonList(kor);
    const e = normalizeSemicolonList(eng);
    if (k && e) return `${k}(${e})`;
    return k || e;
  }

  function pickLocalized(entry, engKey, korKey) {
    if (entry.country === 'Domestic') {
      return (entry[korKey] || entry[engKey] || '').trim();
    }
    return (entry[engKey] || entry[korKey] || '').trim();
  }

  function formatYearMonth(dateStr) {
    if (!dateStr) return '';
    const match = String(dateStr).match(/^(\d{4})-(\d{2})/);
    if (match) return `${match[1]}. ${match[2]}`;
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return '';
    return `${date.getFullYear()}. ${String(date.getMonth() + 1).padStart(2, '0')}`;
  }

  function buildAwardHTML(entry) {
    const authors = formatBilingual(entry.author_kor, entry.author_eng);
    const title = formatBilingual(entry.title_kor, entry.title_eng);
    const date = formatYearMonth(entry.date);
    const awardName = pickLocalized(
      entry,
      'award_name_eng',
      'award_name_kor'
    );
    const organization = pickLocalized(
      entry,
      'organization_eng',
      'organization_kor'
    );

    const head = [];
    if (date) head.push(date);
    if (awardName) head.push(`'<strong>${awardName}</strong>'`);
    if (organization) head.push(`(${organization})`);

    let result = head.join(' ');
    if (title) {
      result = result ? `${result} - '${title}'` : `'${title}'`;
    }
    if (authors) {
      result = result ? `${result}, ${authors}` : authors;
    }
    return result;
  }

  document.addEventListener('DOMContentLoaded', () => {
    let allData = [];

    fetch('{{ site.baseurl }}/data/publications/pub_a.json')
      .then((res) => res.json())
      .then((data) => {
        allData = data;
        initFilters();
        render(allData);
      });

    const filterContainer = document.getElementById('class-filter');
    const contentContainer = document.getElementById('pub-content');

    function initFilters() {
      CLASS_ORDER.forEach((cls) => {
        const btn = document.createElement('a');
        btn.textContent = cls;
        btn.href = `#${cls.toLowerCase()}`;
        btn.className = 'small-button' + (cls === 'ALL' ? ' active' : '');
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          selectedClass = cls;
          render(allData);
          document
            .querySelectorAll('.small-button')
            .forEach((el) => el.classList.remove('active'));
          btn.classList.add('active');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        filterContainer.appendChild(btn);
      });
    }

    function render(data) {
      contentContainer.innerHTML = '';

      const filtered = data
        .filter((item) => item.date)
        .filter((item) => {
          if (!currentSearch) return true;
          const q = currentSearch.toLocaleLowerCase();
          const haystack = buildAwardHTML(item).toLocaleLowerCase();
          return haystack.includes(q);
        })
        .sort((a, b) => b.date.localeCompare(a.date));

      filtered.forEach((entry) => {
        const div = document.createElement('div');
        div.style.marginBottom = '20px';
        const line = document.createElement('div');
        const htmlString = buildAwardHTML(entry);

        if (entry.link) {
          const a = document.createElement('a');
          a.href = entry.link;
          a.target = '_blank';
          a.className = 'paperclick';
          a.innerHTML = htmlString;
          line.appendChild(a);
        } else {
          const span = document.createElement('span');
          span.className = 'paperclick';
          span.innerHTML = htmlString;
          line.appendChild(span);
        }

        div.appendChild(line);
        contentContainer.appendChild(div);
      });
    }

    document.getElementById('search-button').addEventListener('click', () => {
      currentSearch = document.getElementById('search-input').value.trim();
      render(allData);
    });

    document.getElementById('search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        currentSearch = e.target.value.trim();
        render(allData);
      }
    });
  });
</script>
